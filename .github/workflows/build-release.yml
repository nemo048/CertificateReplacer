name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag for this manual build (leave empty for an auto-generated dev tag)"
        required: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run logic test suite
        run: dotnet run --project CertReplacer.Tests -c Release

  build-release:
    needs: test
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained win-x64 exe
        run: >
          dotnet publish CertReplacer/CertReplacer.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -o publish

      - name: Zip build output
        shell: pwsh
        run: Compress-Archive -Path publish/CertReplacer.exe -DestinationPath CertReplacer-win-x64.zip

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              TAG="dev-$(date -u +%Y%m%d%H%M%S)"
            fi
            NAME="CertReplacer $TAG"
            PRERELEASE=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            NAME="CertReplacer $TAG"
            PRERELEASE=false
          else
            # Plain push to main: keep a single rolling pre-release with the newest build.
            TAG="latest"
            NAME="CertReplacer (latest build from main)"
            PRERELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          body: Built from commit ${{ github.sha }}.
          files: |
            publish/CertReplacer.exe
            CertReplacer-win-x64.zip
